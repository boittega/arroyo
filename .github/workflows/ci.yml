name: CI

on: [push, pull_request]

jobs:
  lint-console:
    runs-on: self-hosted
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]
      - name: Run prettier
        run: |
          cd webui
          pnpm check
          
  build-rust:
    runs-on: self-hosted
    env:
      DATABASE_URL: "postgres://arroyo:arroyo@localhost:5432/arroyo"
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Setup Java
        run: |
          eval "$(jenv init -)"
          jenv global 17
          jenv enable-plugin export
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, rustfmt
          toolchain: 1.88
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Setup Python
        run: |
          eval "$(pyenv init -)"
          pyenv install 3.12 -s
          pyenv global 3.12            
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]        
      - name: Install OpenAPI Generator
        run: |
          pnpm install @openapitools/openapi-generator-cli -g
          cd crates/arroyo-openapi && openapi-generator-cli version
      - name: Setup Postgres
        run: |
          brew install postgresql@14
          brew services start postgresql@14
          sleep 5
          psql postgres -c "CREATE USER arroyo WITH PASSWORD 'arroyo' SUPERUSER;"
          createdb arroyo
          cargo install --debug refinery_cli --version 0.8.7
          refinery migrate -e DATABASE_URL -p crates/arroyo-api/migrations
      - name: Install dependencies
        run: |
          curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
          brew install cmake protobuf netcat
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Kafka
        run: |
          brew install kafka
          mkdir -p /tmp/kraft-combined-logs
          kafka-storage format -t 9v5PspiySuWU2l5NjTgRuA -c $(brew --prefix)/etc/kafka/kraft/server.properties
          brew services start kafka
      - name: Install mosquitto
        run: |
          brew install mosquitto
          brew services start mosquitto
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Build console
        run: |
          cd webui
          pnpm build
      - name: Build
        run: cargo build --all-features
      - name: Run Clippy
        run: cargo clippy --all-features --all-targets --workspace -- -D warnings
      - name: Test
        run: cargo nextest run -E 'kind(lib)' --all-features
      - name: Integ postgres
        run: |
          mkdir /tmp/arroyo-integ
          ARROYO__DISABLE_TELEMETRY=true ARROYO__CHECKPOINT_URL=file:///tmp/arroyo-integ ARROYO__COMPILER__ARTIFACT_URL=file:///tmp/artifacts target/debug/arroyo cluster &
          cargo nextest run --package integ -E 'kind(test)'
      - name: Integ sqlite
        run: |
          killall arroyo
          ARROYO__DISABLE_TELEMETRY=true ARROYO__CHECKPOINT_URL=file:///tmp/arroyo-integ ARROYO__COMPILER__ARTIFACT_URL=file:///tmp/artifacts ARROYO__DATABASE__TYPE=sqlite target/debug/arroyo cluster &
          for i in {1..10}; do nc -z localhost 5115 && break || sleep 1; done
          cargo nextest run --package integ -E 'kind(test)'

      - name: Cleanup
        if: always()
        run: |
          killall arroyo || true
          brew services stop postgresql@14
          brew services stop kafka
          brew services stop mosquitto
          rm -rf /tmp/arroyo-integ /tmp/kraft-combined-logs
          
  build-console:
    runs-on: self-hosted
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]
      - name: Build console
        run: |
          cd webui
          pnpm build
